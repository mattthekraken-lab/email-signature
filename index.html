<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matt McCracken - email signature</title>
<!--
  HOW THIS FILE WORKS
  This page shows nothing except your email signature. Open it from your
  GitHub Pages address, press Cmd+A then Cmd+C, and paste it into Gmail.

  Notes in these grey comment blocks never appear on the page, and they
  aren't copied into Gmail.

  Why it's built from tables: Gmail and Outlook ignore most modern layout
  code, but they display tables reliably. Every style is written directly
  onto the part it affects ("inline"), because Gmail removes styles kept
  anywhere else.
-->
</head>
<body style="margin:24px; background:#ffffff;">

<!-- OUTER TABLE: stacks three rows (details, divider line, social icons). -->
<table cellpadding="0" cellspacing="0" border="0" style="font-family:'Trebuchet MS', Arial, sans-serif; font-size:14px; color:#000000;">

  <!-- ROW 1: photo | name and titles | vertical line | phone and email -->
  <tr>
    <td>
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>

          <!-- PHOTO. "headshot.jpg" means "the file next to this page on GitHub".
               When you copy from the live page, your browser turns it into the full
               web address automatically. width/height keep it at 130 x 130 on screen.
               The file itself is 260 x 260, so it stays sharp on high-resolution screens. -->
          <td width="130" style="vertical-align:middle; padding-right:20px;">
            <img src="headshot.jpg" alt="Matt McCracken" width="130" height="130" style="display:block; width:130px; height:130px; border:0;">
          </td>

          <!-- NAME, JOB TITLE AND PUBLICATION LINKS -->
          <td style="vertical-align:middle;">
            <div style="font-size:18px; font-weight:bold; color:#000000; line-height:26px;">Matt McCracken</div>
            <div style="font-size:14px; color:#000000; line-height:22px;">Music Writer</div>
            <div style="font-size:14px; color:#000000; line-height:22px; font-weight:bold;">
              <a href="https://www.guitarworld.com/author/matt-mccracken" style="color:#1155cc;">Guitar World</a> |
              <a href="https://www.musicradar.com/author/matt-mccracken" style="color:#1155cc;">MusicRadar</a> |
              <a href="https://www.guitarplayer.com/author/matt-mccracken" style="color:#1155cc;">Guitar Player</a>
            </div>
          </td>

          <!-- GAP, THEN THE THIN VERTICAL LINE, THEN ANOTHER GAP -->
          <td width="30" style="width:30px;">&nbsp;</td>
          <td width="1" style="width:1px; border-left:1px solid #3a3b3b;">&nbsp;</td>
          <td width="30" style="width:30px;">&nbsp;</td>

          <!-- CONTACT DETAILS. The small icons come from HubSpot's servers, the same
               ones your old signature used. The grey background colour behind each
               icon is what gives it its colour, so leave it in place. -->
          <td style="vertical-align:middle;">
            <table cellpadding="0" cellspacing="0" border="0">
              <tr style="height:25px;">
                <td width="30" style="vertical-align:middle;">
                  <span style="display:inline-block; background-color:#3a3b3b;"><img src="https://cdn2.hubspot.net/hubfs/53/tools/email-signature-generator/icons/phone-icon-2x.png" alt="Phone" width="13" style="display:block;"></span>
                </td>
                <td style="vertical-align:middle;">
                  <a href="tel:+447572510004" style="color:#000000; font-size:14px;">+44 7572 510 004</a>
                </td>
              </tr>
              <tr style="height:25px;">
                <td width="30" style="vertical-align:middle;">
                  <span style="display:inline-block; background-color:#3a3b3b;"><img src="https://cdn2.hubspot.net/hubfs/53/tools/email-signature-generator/icons/email-icon-2x.png" alt="Email" width="13" style="display:block;"></span>
                </td>
                <td style="vertical-align:middle;">
                  <a href="mailto:matt.thekraken@gmail.com" style="color:#000000; font-size:14px;">matt.thekraken@gmail.com</a>
                </td>
              </tr>
              <!-- WEBSITE LINE: removed while matt-thekraken.com is offline.
                   When the site's back, paste this row in here:

                </td>
                <td style="vertical-align:middle;">
                  <a href="https://www.matt-thekraken.com/" style="color:#000000; font-size:14px;">www.matt-thekraken.com</a>
                </td>
              </tr>
              -->
            </table>
          </td>

        </tr>
      </table>
    </td>
  </tr>

  <!-- ROW 2: horizontal divider line, with 30px of space above and below -->

    <td style="padding:30px 0;">
      <table cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
        <tr><td style="border-bottom:1px solid #3a3b3b; height:1px; line-height:1px; font-size:1px;">&nbsp;</td></tr>
